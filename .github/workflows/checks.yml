name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the production Rust version
        run: rustup toolchain install 1.100 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.100 fmt --check
      - name: Restore Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: rust-ci-${{ runner.os }}-${{ runner.arch }}-1.100-${{ hashFiles('Cargo.lock') }}
      - name: Run the Rust tests
        run: cargo +1.100 test --locked
      - name: Save Rust dependencies on main
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  chromium:
    name: Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run the browser and Mini App fixtures
        run: sh tests/chromium.sh
