name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the production Rust version
        run: rustup toolchain install 1.100 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.100 fmt --check
      - name: Run the Rust tests
        run: cargo +1.100 test --locked

  chromium:
    name: Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run the browser and Mini App fixtures
        run: sh tests/chromium.sh
