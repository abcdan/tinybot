[workspace]
members = ["."]
resolver = "3"

[package]
name = "tinybot"
version = "0.1.0"
edition = "2024"
default-run = "tinybot"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
croner = "4.0"
eventsource-stream = "0.2"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
html2text = "0.17"
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "tokio"] }
ipnet = "2"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
mailparse = "0.19"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
