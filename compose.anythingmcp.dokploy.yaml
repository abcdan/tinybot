services:
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    configs:
      - source: gateway_proxy
        target: /etc/nginx/conf.d/default.conf
    expose:
      - "8080"
    depends_on:
      anythingmcp:
        condition: service_healthy
    networks: [gateway_edge, dokploy-network]

  anythingmcp:
    image: helpcodeai/anythingmcp:v0.55.9@sha256:470fbb5bf4e563e10fbb891ebf9548607cb731004fb7186af336e7f2145db406
    platform: linux/amd64
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Keep upstream license and fallback mail requests on this container.
    extra_hosts:
      - "anythingmcp.com=127.0.0.1"
      - "cloud.anythingmcp.com=127.0.0.1"
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: self-hosted
      PORT: "4000"
      DATABASE_URL: postgresql://anythingmcp:${AMCP_POSTGRES_PASSWORD:?Set AMCP_POSTGRES_PASSWORD}@postgres:5432/anythingmcp
      JWT_SECRET: ${AMCP_JWT_SECRET:?Set AMCP_JWT_SECRET}
      COOKIE_SECRET: ${AMCP_COOKIE_SECRET:?Set AMCP_COOKIE_SECRET}
      ENCRYPTION_KEY: ${AMCP_ENCRYPTION_KEY:?Set AMCP_ENCRYPTION_KEY}
      FRONTEND_URL: https://${AMCP_DOMAIN:?Set AMCP_DOMAIN}
      SERVER_URL: https://${AMCP_DOMAIN:?Set AMCP_DOMAIN}
      CORS_ORIGIN: https://${AMCP_DOMAIN:?Set AMCP_DOMAIN}
      MCP_AUTH_MODE: both
      MCP_ALLOW_ANONYMOUS: "false"
      ALLOW_OPEN_REGISTRATION: "false"
      LICENSE_USAGE_REPORT: "false"
      SMTP_HOST: ${AMCP_SMTP_HOST:-}
      SMTP_PORT: ${AMCP_SMTP_PORT:-587}
      SMTP_USER: ${AMCP_SMTP_USER:-}
      SMTP_PASS: ${AMCP_SMTP_PASS:-}
      SMTP_FROM: ${AMCP_SMTP_FROM:-}
      SMTP_SECURE: ${AMCP_SMTP_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [gateway, gateway_edge]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: anythingmcp
      POSTGRES_PASSWORD: ${AMCP_POSTGRES_PASSWORD:?Set AMCP_POSTGRES_PASSWORD}
      POSTGRES_DB: anythingmcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "anythingmcp", "-d", "anythingmcp"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [gateway]

networks:
  gateway:
    internal: true
  gateway_edge:
  dokploy-network:
    external: true

configs:
  gateway_proxy:
    file: ./deploy/anythingmcp-nginx.conf

volumes:
  postgres_data:
