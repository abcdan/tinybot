include:
  - path:
      - compose.anythingmcp.yaml
      - deploy/anythingmcp-dokploy-network.yaml
      - deploy/anythingmcp-dokploy-routing.yaml

services:
  tinybot:
    extends:
      file: compose.services.yaml
      service: tinybot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Dokploy}
      TINYBOT_ENCRYPTION_KEY: ${TINYBOT_ENCRYPTION_KEY:?Set TINYBOT_ENCRYPTION_KEY in Dokploy}
      TINYBOT_ANYTHINGMCP_ORIGIN: https://${AMCP_DOMAIN:-mcp.${TINYBOT_DOMAIN}}
    expose:
      - "8080"
    networks:
      - edge
      - dokploy-network
    depends_on:
      browser:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  browser:
    extends:
      file: compose.services.yaml
      service: browser
    depends_on: [egress]

  egress:
    extends:
      file: compose.services.yaml
      service: egress

  sandbox:
    extends:
      file: compose.services.yaml
      service: sandbox

  mcp-stdio:
    extends:
      file: compose.services.yaml
      service: mcp-stdio

networks:
  edge:
  browser_internal:
    internal: true
  browser_public:

volumes:
  app_data:
  browser_socket:
  browser_proxy:
  sandbox_socket:
  stdio_socket:
