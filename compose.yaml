services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      TINYBOT_DOMAIN: ${TINYBOT_DOMAIN:?Set TINYBOT_DOMAIN in .env}
    ports:
      - "${TINYBOT_HTTP_PORT:-80}:80"
      - "${TINYBOT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      tinybot:
        condition: service_healthy

  tinybot:
    extends:
      file: compose.services.yaml
      service: tinybot
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TINYBOT_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    secrets: [telegram_bot_token, encryption_key]
    depends_on:
      browser:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  browser:
    extends:
      file: compose.services.yaml
      service: browser
    depends_on: [egress]

  egress:
    extends:
      file: compose.services.yaml
      service: egress

  sandbox:
    extends:
      file: compose.services.yaml
      service: sandbox

  mcp-stdio:
    extends:
      file: compose.services.yaml
      service: mcp-stdio

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  encryption_key:
    file: ./secrets/encryption_key

networks:
  edge:
  browser_internal:
    internal: true
  browser_public:

volumes:
  app_data:
  caddy_data:
  caddy_config:
  browser_socket:
  browser_proxy:
  sandbox_socket:
  stdio_socket:
