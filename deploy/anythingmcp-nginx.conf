map $uri $anythingmcp_authorization {
    ~*^/api/auth/register/?$ "";
    default $http_authorization;
}

server {
    listen 8080;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dashboard http://anythingmcp:3000;
    set $oauth_backend http://anythingmcp:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $anythingmcp_authorization;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_buffering off;

    # The pinned dashboard's sign-in guard intercepts these OAuth routes.
    location = /callback {
        proxy_pass $oauth_backend;
    }

    location = /revoke {
        proxy_pass $oauth_backend;
    }

    location = /setup {
        auth_basic "AnythingMCP first admin setup";
        auth_basic_user_file /run/anythingmcp-setup/htpasswd;
        try_files /anythingmcp-setup-redirect @setup_redirect;
    }

    location @setup_redirect {
        absolute_redirect off;
        return 302 /login?mode=register;
    }

    # Guard the actual registration API, including the router's case and slash variants.
    location ~* ^/api/auth/register/?$ {
        auth_basic "AnythingMCP first admin setup";
        auth_basic_user_file /run/anythingmcp-setup/htpasswd;
        proxy_pass $oauth_backend;
    }

    location / {
        proxy_pass $dashboard;
    }
}
