<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TinyBot</title>
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/mini.js"></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <span class="mark" aria-hidden="true"><i></i><i></i></span>
      <div class="brand"><h1>TinyBot</h1><p id="chief-label" hidden></p></div>
      <button id="refresh" class="quiet refresh-control" type="button" aria-label="Refresh" title="Refresh" hidden>
        <span aria-hidden="true">↻</span>
      </button>
    </header>
    <nav aria-label="TinyBot" id="tabs" hidden>
      <button type="button" data-tab="home" aria-current="page"><span class="nav-icon icon-tasks" aria-hidden="true"></span>Tasks</button>
      <button type="button" data-tab="agents"><span class="nav-icon icon-helpers" aria-hidden="true"></span>Helpers</button>
      <button type="button" data-tab="audit"><span class="nav-icon icon-activity" aria-hidden="true"></span>Activity</button>
      <button type="button" data-tab="settings"><span class="nav-icon icon-settings" aria-hidden="true">⚙︎</span>Settings</button>
    </nav>
    <div id="status" class="notice" role="status" aria-live="polite" hidden></div>
    <section id="view" aria-label="TinyBot workspace" tabindex="-1"><p>Opening TinyBot…</p></section>
    <footer class="app-footer" hidden>
      <a id="source-link" href="https://github.com/abcdan/tinybot" target="_blank" rel="noopener noreferrer">
        Source on GitHub <span aria-hidden="true">↗</span>
      </a>
    </footer>
  </main>
</body>
</html>
